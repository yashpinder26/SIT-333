<!DOCTYPE html>
<html>
<head>
  <title>User Registration</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input, select { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
    input[type=submit] { margin-top: 20px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
    input[type=submit]:hover { background-color: #45a049; }
    .error { color: red; font-size: 0.9em; }
  </style>
</head>
<body>

<h2>User Registration</h2>

<form action="http://127.0.0.1:8082/reg" method="get" id="regForm">

  <label for="fname">First Name: <span class="error">*</span></label>
  <input type="text" id="fname" name="fname" placeholder="Enter first name">

  <label for="lname">Last Name: <span class="error">*</span></label>
  <input type="text" id="lname" name="lname" placeholder="Enter last name">

  <label for="username">Username: <span class="error">*</span></label>
  <input type="text" id="username" name="username" placeholder="Choose a username">

  <label for="email">Email Address: <span class="error">*</span></label>
  <input type="text" id="email" name="email" placeholder="Enter email address">

  <label for="passwd">Password: <span class="error">*</span></label>
  <input type="password" id="passwd" name="passwd" placeholder="Choose a password">

  <label for="phone">Phone Number:</label>
  <input type="tel" id="phone" name="phone" placeholder="e.g. 0412345678">

  <label for="dob">Date of Birth: <span class="error">*</span></label>
  <input type="date" id="dob" name="dob">

  <label for="gender">Gender:</label>
  <select id="gender" name="gender">
    <option value="">-- Select --</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
    <option value="other">Other</option>
    <option value="prefer_not">Prefer not to say</option>
  </select>

  <label for="address">Address:</label>
  <input type="text" id="address" name="address" placeholder="Street address">

  <label for="city">City:</label>
  <input type="text" id="city" name="city" placeholder="City">

  <label for="country">Country:</label>
  <input type="text" id="country" name="country" placeholder="Country">

  <br>
  <input type="submit" value="Register" id="submitBtn">
</form>

<p>If you click the "Register" button, the form-data will be sent to the registration servlet.</p>

</body>
</html>
